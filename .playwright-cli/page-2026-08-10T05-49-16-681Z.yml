                  - paragraph [ref=e253]:
                    - strong [ref=e254]: 易于学习和上手：
                    - text: 对于有Web开发背景（尤其是HTML/CSS）的开发者来说，QML的语法和结构非常熟悉，学习曲线平缓。即使是新手，也能快速构建出漂亮的界面。
                - listitem [ref=e255]:
                  - paragraph [ref=e256]:
                    - strong [ref=e257]: 强大的集成开发环境：
                    - text: Qt Creator IDE为QML开发提供了极佳的支持，包括：
                  - list [ref=e258]:
                    - listitem [ref=e259]:
                      - paragraph [ref=e260]:
                        - strong [ref=e261]: 所见即所得的UI设计器：
                        - text: 可以直接拖放组件来设计界面。
                    - listitem [ref=e262]:
                      - paragraph [ref=e263]:
                        - strong [ref=e264]: 实时预览：
                        - text: 修改QML代码后，可以几乎实时地看到界面变化，极大地提高了开发效率。
                    - listitem [ref=e265]:
                      - paragraph [ref=e266]:
                        - strong [ref=e267]: 强大的调试工具：
                        - text: 可以调试QML和JavaScript代码，检查对象树和属性。
              - heading "2. 性能与表现力" [level=4] [ref=e268]: 2. 性能与表现力
              - list [ref=e269]:
                - listitem [ref=e270]:
                  - paragraph [ref=e271]:
                    - strong [ref=e272]: 硬件加速的图形渲染：
                    - text: QML场景图默认使用OpenGL（或其他图形API，如Vulkan、Metal）进行渲染，能够充分利用GPU。这使得实现流畅的动画、复杂的视觉效果和60FPS的流畅界面成为可能。// 鼠标悬停时，矩形在0.2秒内变为红色
