                - listitem [ref=e360]:
                  - paragraph [ref=e361]:
                    - strong [ref=e362]: 原生般的性能：
                    - text: 当与C++后端结合时，QML应用既能拥有漂亮的界面，又能获得接近原生的性能。逻辑计算密集的任务可以用高效的C++完成，而UI展示和交互则由QML负责，做到了性能与美感的平衡。
              - heading "3. 架构与可维护性" [level=4] [ref=e363]: 3. 架构与可维护性
              - list [ref=e364]:
                - listitem [ref=e365]:
                  - paragraph [ref=e366]:
                    - strong [ref=e367]: 清晰的关注点分离：
                    - text: QML鼓励采用
                    - strong [ref=e368]: MVVM（Model-View-ViewModel）或类似MVC的架构
                    - text: 。QML负责View（视图），C++负责Model（模型）和复杂的业务逻辑。这种分离使得代码更清晰、更易于测试和维护。// MyButton.qml
