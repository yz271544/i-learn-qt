                  - paragraph [ref=e247]:
                    - strong [ref=e248]: 易于学习和上手：
                    - text: 对于有Web开发背景（尤其是HTML/CSS）的开发者来说，QML的语法和结构非常熟悉，学习曲线平缓。即使是新手，也能快速构建出漂亮的界面。
                - listitem [ref=e249]:
                  - paragraph [ref=e250]:
                    - strong [ref=e251]: 强大的集成开发环境：
                    - text: Qt Creator IDE为QML开发提供了极佳的支持，包括：
                  - list [ref=e252]:
                    - listitem [ref=e253]:
                      - paragraph [ref=e254]:
                        - strong [ref=e255]: 所见即所得的UI设计器：
                        - text: 可以直接拖放组件来设计界面。
                    - listitem [ref=e256]:
                      - paragraph [ref=e257]:
                        - strong [ref=e258]: 实时预览：
                        - text: 修改QML代码后，可以几乎实时地看到界面变化，极大地提高了开发效率。
                    - listitem [ref=e259]:
                      - paragraph [ref=e260]:
                        - strong [ref=e261]: 强大的调试工具：
                        - text: 可以调试QML和JavaScript代码，检查对象树和属性。
              - heading "2. 性能与表现力" [level=4] [ref=e262]: 2. 性能与表现力
              - list [ref=e263]:
                - listitem [ref=e264]:
                  - paragraph [ref=e265]:
                    - strong [ref=e266]: 硬件加速的图形渲染：
                    - text: QML场景图默认使用OpenGL（或其他图形API，如Vulkan、Metal）进行渲染，能够充分利用GPU。这使得实现流畅的动画、复杂的视觉效果和60FPS的流畅界面成为可能。// 鼠标悬停时，矩形在0.2秒内变为红色
